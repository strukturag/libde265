name: coverity

on:
  push:
    branches: [ coverity ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      with:
        persist-credentials: false

    - name: Get checksum of the current Coverity build tool
      id: coverity-md5
      env:
        TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
      run: |
        md5=$(curl -sSf --data "token=$TOKEN&project=libde265&md5=1" https://scan.coverity.com/download/linux64)
        echo "md5=$md5" >> "$GITHUB_OUTPUT"

    - name: Cache Coverity build tool
      id: coverity-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
      with:
        path: coverity_tool.tar.gz
        key: coverity-tool-${{ runner.os }}-${{ steps.coverity-md5.outputs.md5 }}

    - name: Download Coverity build tool
      if: steps.coverity-cache.outputs.cache-hit != 'true'
      env:
        TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
      run: |
        curl -sSfL --data "token=$TOKEN&project=libde265" -o coverity_tool.tar.gz https://scan.coverity.com/download/linux64

    - name: Unpack Coverity build tool
      run: |
        mkdir coverity_tool
        tar xzf coverity_tool.tar.gz --strip 1 -C coverity_tool

    - name: Install dependencies
      run: |
        ./scripts/ci-before-install-linux.sh

    - name: Prepare CI
      run: |
        ./scripts/ci-before-script.sh

    - name: Build with Coverity build tool
      run: |
        export PATH=`pwd`/coverity_tool/bin:$PATH
        cov-build --dir cov-int cmake --build build

    - name: Submit build result to Coverity Scan
      env:
        TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
      run: |
        tar czvf libde265.tar.gz cov-int
        curl --form token=$TOKEN \
          --form email=opensource@struktur.de \
          --form file=@libde265.tar.gz \
          --form version="Commit $GITHUB_SHA" \
          --form description="Build submitted via CI" \
          https://scan.coverity.com/builds?project=libde265
